name: Android CI - Mi Bolsillo Inteligente

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Validar y compilar APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK requerido
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # Este repositorio no contiene gradle-wrapper.jar.
      # Se instala Gradle 8.9 y se usa el comando gradle directamente.
      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Comprobar configuracion
        run: |
          set -euxo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle/libs.versions.toml
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          gradle --version

      - name: Limpiar y ejecutar pruebas unitarias
        run: gradle --no-daemon --stacktrace clean testDebugUnitTest

      - name: Ejecutar Lint
        run: gradle --no-daemon --stacktrace lintDebug

      - name: Compilar APK Debug
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Compilar APK Release
        env:
          KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID_RELEASE: ${{ secrets.ADMOB_APP_ID_RELEASE }}
          ADMOB_BANNER_ID_RELEASE: ${{ secrets.ADMOB_BANNER_ID_RELEASE }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Generar Android App Bundle
        env:
          KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID_RELEASE: ${{ secrets.ADMOB_APP_ID_RELEASE }}
          ADMOB_BANNER_ID_RELEASE: ${{ secrets.ADMOB_BANNER_ID_RELEASE }}
        run: gradle --no-daemon --stacktrace bundleRelease

      - name: Subir APK, AAB y reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mi-bolsillo-inteligente-android
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
