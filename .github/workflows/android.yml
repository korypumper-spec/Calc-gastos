
name: Android CI - Mi Bolsillo Inteligente

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Compilar aplicación Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verificar archivos del proyecto
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle/libs.versions.toml
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew --version

      - name: Limpiar proyecto
        run: ./gradlew --no-daemon clean

      - name: Ejecutar pruebas unitarias
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compilar APK Debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Ejecutar Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Preparar firma Release
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            FILE="$RUNNER_TEMP/release-keystore.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$FILE"
            test -s "$FILE"
            chmod 600 "$FILE"
            echo "keystore=$FILE" >> "$GITHUB_OUTPUT"
          else
            echo "keystore=" >> "$GITHUB_OUTPUT"
            echo "Sin firma de producción: se generará Release sin firmar."
          fi

      - name: Compilar APK Release
        env:
          KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID_RELEASE: ${{ secrets.ADMOB_APP_ID_RELEASE }}
          ADMOB_BANNER_ID_RELEASE: ${{ secrets.ADMOB_BANNER_ID_RELEASE }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Generar Android App Bundle
        env:
          KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID_RELEASE: ${{ secrets.ADMOB_APP_ID_RELEASE }}
          ADMOB_BANNER_ID_RELEASE: ${{ secrets.ADMOB_BANNER_ID_RELEASE }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Comprobar APK Debug
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Limpiar llave temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/release-keystore.jks"

      - name: Publicar artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mi-bolsillo-inteligente-artefactos
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
