name: Android CI - Calculadora de Gastos

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Validar, probar y compilar Android APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK y componentes (API 35 / Build Tools 35.0.0)
        run: |
          set -euxo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ] || [ ! -w "$SDK_DIR" ]; then
            SDK_DIR="$HOME/android-sdk"
            mkdir -p "$SDK_DIR"
          fi

          if [ ! -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ] && ! command -v sdkmanager >/dev/null 2>&1; then
            TMP_ZIP="$RUNNER_TEMP/cmdline-tools.zip"
            curl -fSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$TMP_ZIP"
            mkdir -p "$SDK_DIR/cmdline-tools"
            unzip -q "$TMP_ZIP" -d "$SDK_DIR/cmdline-tools"
            mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
            rm -f "$TMP_ZIP"
          fi

          SDKMANAGER_BIN="sdkmanager"
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_BIN="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER_BIN" --sdk_root="$SDK_DIR" --licenses >/dev/null || true
          "$SDKMANAGER_BIN" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar caché de Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Verificar Gradle Wrapper y archivos clave
        run: |
          set -euxo pipefail
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle/libs.versions.toml
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          chmod +x gradlew
          ./gradlew --no-daemon --version

      - name: Limpiar compilaciones previas
        run: ./gradlew --no-daemon --stacktrace clean

      - name: Compilar código Kotlin (Debug)
        run: ./gradlew --no-daemon --stacktrace :app:compileDebugKotlin

      - name: Ejecutar pruebas unitarias (Debug)
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Ejecutar análisis estático Lint (Debug)
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Compilar APK Debug
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Preparar firma Release (si hay secretos configurados)
        id: prepare_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/release-keystore.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            echo "keystore_file=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
            echo "Keystore de lanzamiento preparado temporalmente."
          else
            echo "keystore_file=" >> "$GITHUB_OUTPUT"
            echo "Aviso: ANDROID_KEYSTORE_BASE64 no está definido; se compilará release sin firmar."
          fi

      - name: Compilar APK Release
        env:
          KEYSTORE_FILE: ${{ steps.prepare_signing.outputs.keystore_file }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID_RELEASE: ${{ secrets.ADMOB_APP_ID_RELEASE }}
          ADMOB_BANNER_ID_RELEASE: ${{ secrets.ADMOB_BANNER_ID_RELEASE }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Generar Android App Bundle (.aab) Release
        env:
          KEYSTORE_FILE: ${{ steps.prepare_signing.outputs.keystore_file }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID_RELEASE: ${{ secrets.ADMOB_APP_ID_RELEASE }}
          ADMOB_BANNER_ID_RELEASE: ${{ secrets.ADMOB_BANNER_ID_RELEASE }}
        run: ./gradlew --no-daemon --stacktrace bundleRelease

      - name: Limpiar keystore temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/release-keystore.jks"

      - name: Subir artefactos compilados y reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-de-gastos-android-artefactos
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
